<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Key Change Detector</title>
  <meta name="description" content="Browse your music library, see each track's key and key changes, find keyless sections, and build harmonically mixed DJ sets. Runs entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236d5dfc'/%3E%3Cpath d='M12 23V9l11-2v14' stroke='white' stroke-width='2.4' fill='none' stroke-linejoin='round'/%3E%3Ccircle cx='9.5' cy='23' r='3' fill='white'/%3E%3Ccircle cx='20.5' cy='21' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M12 23V9l11-2v14" stroke="white" stroke-width="2.4" fill="none" stroke-linejoin="round"/><circle cx="9.5" cy="23" r="3" fill="white"/><circle cx="20.5" cy="21" r="3" fill="white"/></svg>
        <span>Key Change Detector</span>
      </div>
      <div class="topbar-actions">
        <div class="seg" role="radiogroup" aria-label="Key notation" title="Show keys as Camelot codes, key names, or both">
          <button type="button" role="radio" data-notation="camelot">Camelot</button>
          <button type="button" role="radio" data-notation="musical">Key</button>
          <button type="button" role="radio" data-notation="both">Both</button>
        </div>
        <button id="open-files-btn" class="btn ghost small" type="button" title="Analyze individual FLAC, WAV or MP3 files">Open files</button>
        <button id="settings-btn" class="btn ghost small" type="button" aria-haspopup="dialog">Settings</button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Library and sets">
      <nav class="nav">
        <button class="nav-item" type="button" data-nav="library">
          <span>Library</span><span id="lib-count" class="nav-count"></span>
        </button>
      </nav>
      <div id="folder-box" class="folder-box"></div>

      <div class="sets-head">
        <span>Sets</span>
        <button id="new-set" class="icon-btn" type="button" aria-label="New set" title="New set">+</button>
      </div>
      <ul id="set-nav" class="set-nav"></ul>

      <div id="queue-status" class="queue-status" hidden></div>
    </aside>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="playerbar" aria-label="Player">
      <div class="pb-info">
        <div id="pb-title" class="pb-title">Nothing playing</div>
        <div id="pb-sub" class="pb-sub"></div>
      </div>
      <div class="pb-controls">
        <button id="pb-prev" class="icon-btn" type="button" aria-label="Previous">⏮</button>
        <button id="pb-play" class="pb-play" type="button" aria-label="Play">▶</button>
        <button id="pb-next" class="icon-btn" type="button" aria-label="Next">⏭</button>
      </div>
      <div class="pb-seek">
        <span id="pb-time" class="pb-time">0:00</span>
        <div id="pb-bar" class="pb-bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <canvas id="pb-canvas"></canvas>
        </div>
        <span id="pb-dur" class="pb-time">0:00</span>
      </div>
      <div class="pb-now">
        <span class="muted small">Now</span>
        <span id="pb-key"></span>
      </div>
      <label class="pb-vol">
        <span class="visually-hidden">Volume</span>
        <input id="pb-volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </label>
    </footer>
  </div>

  <dialog id="settings" class="dialog">
    <form method="dialog">
      <h2>Analysis settings</h2>
      <div class="settings-grid">
        <label>Key change sensitivity
          <select name="sensitivity">
            <option value="low">Low: only clear, lasting modulations</option>
            <option value="medium">Medium</option>
            <option value="high">High: catch brief or subtle changes</option>
          </select>
        </label>
        <label>No-key detection
          <select name="noKey">
            <option value="off">Off: always assign a key</option>
            <option value="lenient">Lenient: only clearly unpitched parts</option>
            <option value="normal">Normal</option>
            <option value="strict">Strict: weakly tonal parts count as no key</option>
          </select>
        </label>
        <label>Shortest section
          <select name="minSectionSec">
            <option value="6">6 seconds</option>
            <option value="12">12 seconds</option>
            <option value="20">20 seconds</option>
            <option value="30">30 seconds</option>
          </select>
        </label>
        <label>Key profile
          <select name="profile">
            <option value="combined">Combined (recommended)</option>
            <option value="krumhansl">Krumhansl-Kessler (classical)</option>
            <option value="temperley">Temperley (pop/rock)</option>
          </select>
        </label>
      </div>
      <p class="muted small">Changing settings re-analyzes your library in the background. Results for every setting are cached on this device.</p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" type="submit">Cancel</button>
        <button class="btn primary" value="save" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <input id="open-files" type="file" multiple accept=".flac,.wav,.mp3,audio/flac,audio/x-flac,audio/wav,audio/x-wav,audio/wave,audio/mpeg" hidden>
  <input id="folder-input" type="file" webkitdirectory multiple hidden>
  <audio id="audio" preload="auto"></audio>
  <div id="drop-overlay" class="drop-overlay" hidden><div>Drop FLAC, WAV or MP3 files to analyze them</div></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
